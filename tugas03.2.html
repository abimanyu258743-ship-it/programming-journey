<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text  Decoration</title>
  <style>
    h1 {
      text-decoration: underline;
    }
    p {
      line-height: 2;
    }
    .upperline {
      text-decoration: overline;
    }
    .underline {
      text-decoration: line-through;
    }
    .strike {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>Contoh Text Decoration</h1>
  <p>
    <span class="underline">Ini teks dengan dekotrasi bawah</span>. Ini teks normal,
    tanpa dekorasi apapun. Ini teks tanpa dekorasi. Ini teks <span class="strike">yang dicoret</span>.
    <span class="upperline">Ini teks dengan dekorasi garis di atas.</span>
  </p>
</body>
</html>
